name: Copy Right Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"

jobs:
  license-check:
    name: Copy Right Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check copyright headers
        run: node packages/codemods/copyright-headers.mjs --check --changed-from "origin/${{ github.base_ref }}"
