  PLANE_AUDIT_MIGRATION_ROLE: ${PLANE_AUDIT_MIGRATION_ROLE:-plane_migrator}
  PLANE_AUDIT_PROVISIONER_ROLE: ${PLANE_AUDIT_PROVISIONER_ROLE:-plane_provisioner}
  PLANE_AUDIT_ENFORCE_ROLE_SEPARATION: ${PLANE_AUDIT_ENFORCE_ROLE_SEPARATION:-1}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
