  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  PLANE_AGENT_RUNTIME_URL: ${PLANE_AGENT_RUNTIME_URL:-http://agent-runtime:8080}
  PLANE_AGENT_RUNTIME_HOST_URL: ${PLANE_AGENT_RUNTIME_HOST_URL:-http://api:8091}
  PLANE_AGENT_RUNTIME_HOST_BIND: ${PLANE_AGENT_RUNTIME_HOST_BIND:-0.0.0.0}
  PLANE_AGENT_RUNTIME_HOST_PORT: ${PLANE_AGENT_RUNTIME_HOST_PORT:-8091}
  PLANE_AGENT_RUNTIME_DISPATCH_PATH: ${PLANE_AGENT_RUNTIME_DISPATCH_PATH:-/v1/runtime/dispatch}
  PLANE_AGENT_RUNTIME_SECRET_FILE: /run/secrets/plane_agent_runtime
  PLANE_AGENT_RUNTIME_CREDENTIAL_RESOLVER: ${PLANE_AGENT_RUNTIME_CREDENTIAL_RESOLVER:-command:/usr/local/bin/plane-agent-runtime-credential-resolver}
  PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE: ${PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE:-/run/plane-agent-credentials/revocations.json}

x-agent-runtime-env: &agent-runtime-env
