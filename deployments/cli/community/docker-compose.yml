  PLANE_AGENT_RUNTIME_DISPATCH_PATH: ${PLANE_AGENT_RUNTIME_DISPATCH_PATH:-/v1/runtime/dispatch}
  PLANE_AGENT_RUNTIME_LEDGER_PATH: ${PLANE_AGENT_RUNTIME_LEDGER_PATH:-/run/plane-agent-runtime/dispatch-ledger.sqlite}
  PLANE_AGENT_RUNTIME_SECRET_FILE: /run/secrets/plane_agent_runtime
  PLANE_AGENT_RUNTIME_HEALTH_PATH: ${PLANE_AGENT_RUNTIME_HEALTH_PATH:-/health/ready}
  PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE: ${PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE:-/run/plane-agent-runtime/safety-stop}
  PLANE_AGENT_RUNTIME_NETWORK_POLICY: none
  PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE: ${PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE:-/run/plane-agent-credentials/revocations.json}
  PLANE_AGENT_RUNTIME_PROVIDER: ${PLANE_AGENT_RUNTIME_PROVIDER:-xai}
  PLANE_AGENT_RUNTIME_PROVIDER_HOST: ${PLANE_AGENT_RUNTIME_PROVIDER_HOST:-api.x.ai}
  PLANE_AGENT_RUNTIME_PROVIDER_PATH: ${PLANE_AGENT_RUNTIME_PROVIDER_PATH:-/v1/chat/completions}
  PLANE_AGENT_RUNTIME_PROVIDER_MODELS: ${PLANE_AGENT_RUNTIME_PROVIDER_MODELS:-grok-4}
  PLANE_AGENT_RUNTIME_PROVIDER_CREDENTIAL_NAME: ${PLANE_AGENT_RUNTIME_PROVIDER_CREDENTIAL_NAME:-api_key}
  PLANE_AGENT_RUNTIME_BIND: 0.0.0.0
  PLANE_AGENT_RUNTIME_PORT: 8080

x-runtime-db-env: &runtime-db-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane_runtime:change-this-runtime-password@plane-db/plane}
  DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:-postgresql://plane_runtime:change-this-runtime-password@plane-db/plane}

x-migration-db-env: &migration-db-env
  DATABASE_URL: ${DATABASE_MIGRATION_URL:-postgresql://plane_migrator:change-this-migration-password@plane-db/plane}
  DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql://plane_migrator:change-this-migration-password@plane-db/plane}
  PLANE_DB_MIGRATION_MODE: "1"
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${PLANE_AUDIT_MIGRATION_ROLE:-plane_migrator}
  POSTGRES_PASSWORD: ${PLANE_AUDIT_MIGRATION_PASSWORD:-change-this-migration-password}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-provisioner-db-env: &provisioner-db-env
  DATABASE_PROVISIONER_URL: ${DATABASE_PROVISIONER_URL:-postgresql://plane_provisioner:change-this-provisioner-password@plane-db/plane}
  PLANE_AUDIT_RUNTIME_PASSWORD: ${PLANE_AUDIT_RUNTIME_PASSWORD:-change-this-runtime-password}
  PLANE_AUDIT_MIGRATION_PASSWORD: ${PLANE_AUDIT_MIGRATION_PASSWORD:-change-this-migration-password}
  PLANE_DB_PROVISIONER_MODE: "1"
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_PROVISIONER_ROLE:-plane_provisioner}
  POSTGRES_PASSWORD: ${POSTGRES_PROVISIONER_PASSWORD:-change-this-provisioner-password}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

services:
  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-stable}
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  space:
    image: makeplane/plane-space:${APP_RELEASE:-stable}
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-stable}
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:${APP_RELEASE:-stable}
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
      - agent_runtime_credential_state:/run/plane-agent-credentials
    expose:
      - "8091"
    networks:
      - default
      - agent_runtime_internal
    environment:
      <<: [*app-env, *runtime-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    secrets:
      - plane_agent_runtime
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started
      provisioner-final:
        condition: service_completed_successfully

  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
      - agent_runtime_credential_state:/run/plane-agent-credentials
    expose:
      - "8091"
    networks:
      - default
      - agent_runtime_internal
    environment:
      <<: [*app-env, *runtime-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
      PLANE_AGENT_RUNTIME_HOST_URL: ${PLANE_AGENT_RUNTIME_WORKER_HOST_URL:-http://worker:8091}
    secrets:
      - plane_agent_runtime
    depends_on:
      provisioner-final:
        condition: service_completed_successfully
      api:
        condition: service_started
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *runtime-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    secrets:
      - plane_agent_runtime
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  agent-runtime:
    image: ${PLANE_AGENT_RUNTIME_IMAGE:-uxheavy/plane-agent-runtime:hermes-114eabf9-g4-8eca1312}
    entrypoint: ["python3", "-m", "plane.agent.runtime.service"]
    command: []
    user: "${PLANE_AGENT_RUNTIME_UID:-65532}:${PLANE_AGENT_RUNTIME_GID:-65532}"
    read_only: true
    networks:
      - agent_runtime_internal
      - agent_runtime_egress
    init: true
    expose:
      - "8080"
    environment:
      <<: *agent-runtime-env
    secrets:
      - plane_agent_runtime
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/plane-agent-runtime:rw,noexec,nosuid,nodev,size=1m
    volumes:
      - agent_runtime_credential_state:/run/plane-agent-credentials:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${PLANE_AGENT_RUNTIME_CPUS:-1.0}
    mem_limit: ${PLANE_AGENT_RUNTIME_MEMORY_LIMIT:-768m}
    pids_limit: ${PLANE_AGENT_RUNTIME_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health/ready\", timeout=2)' "]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *migration-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      provisioner:
        condition: service_completed_successfully
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started

  provisioner:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-provisioner.sh --phase=before-migrate
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_provisioner:/code/plane/logs
    environment:
      <<: [*app-env, *provisioner-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db

  provisioner-final:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-provisioner.sh --phase=after-migrate
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_provisioner:/code/plane/logs
    environment:
      <<: [*app-env, *provisioner-db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Comment this if you already have a database running
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Comment this if you using any external s3 compatible storage
  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  # Comment this if you already have a reverse proxy running
  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-stable}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  logs_provisioner:
  rabbitmq_data:
  proxy_config:
  proxy_data:
  agent_runtime_credential_state:

networks:
  default:
  agent_runtime_internal:
    internal: true
  agent_runtime_egress:
    driver: bridge

secrets:
  plane_agent_runtime:
    environment: PLANE_AGENT_RUNTIME_SECRET
