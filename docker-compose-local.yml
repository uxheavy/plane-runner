x-local-agent-runtime-app-env: &local-agent-runtime-app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
  PLANE_AGENT_RUNTIME_ENABLED: ${PLANE_AGENT_RUNTIME_ENABLED:-0}
  PLANE_AGENT_RUNTIME_URL: ${PLANE_AGENT_RUNTIME_URL:-http://agent-runtime:8080}
  PLANE_AGENT_RUNTIME_HOST_URL: ${PLANE_AGENT_RUNTIME_HOST_URL:-http://api:8091}
  PLANE_AGENT_RUNTIME_HOST_BIND: ${PLANE_AGENT_RUNTIME_HOST_BIND:-0.0.0.0}
  PLANE_AGENT_RUNTIME_HOST_PORT: ${PLANE_AGENT_RUNTIME_HOST_PORT:-8091}
  PLANE_AGENT_RUNTIME_DISPATCH_PATH: ${PLANE_AGENT_RUNTIME_DISPATCH_PATH:-/v1/runtime/dispatch}
  PLANE_AGENT_RUNTIME_SECRET_FILE: /run/secrets/plane_agent_runtime
  PLANE_AGENT_RUNTIME_LEDGER_PATH: ${PLANE_AGENT_RUNTIME_LEDGER_PATH:-/run/plane-agent-runtime/dispatch-ledger.sqlite}
  PLANE_AGENT_RUNTIME_HEALTH_PATH: ${PLANE_AGENT_RUNTIME_HEALTH_PATH:-/health/ready}
  PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE: ${PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE:-/run/plane-agent-runtime/safety-stop}
  PLANE_AGENT_RUNTIME_CREDENTIAL_RESOLVER: ${PLANE_AGENT_RUNTIME_CREDENTIAL_RESOLVER:-}
  PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE: ${PLANE_AGENT_RUNTIME_CREDENTIAL_STATE_FILE:-/run/plane-agent-credentials/revocations.json}

x-local-agent-runtime-service-env: &local-agent-runtime-service-env
  DJANGO_SETTINGS_MODULE: plane.settings.common
  PLANE_AGENT_RUNTIME_URL: ${PLANE_AGENT_RUNTIME_URL:-http://agent-runtime:8080}
  PLANE_AGENT_RUNTIME_DISPATCH_PATH: ${PLANE_AGENT_RUNTIME_DISPATCH_PATH:-/v1/runtime/dispatch}
  PLANE_AGENT_RUNTIME_LEDGER_PATH: ${PLANE_AGENT_RUNTIME_LEDGER_PATH:-/run/plane-agent-runtime/dispatch-ledger.sqlite}
  PLANE_AGENT_RUNTIME_SECRET_FILE: /run/secrets/plane_agent_runtime
  PLANE_AGENT_RUNTIME_HEALTH_PATH: ${PLANE_AGENT_RUNTIME_HEALTH_PATH:-/health/ready}
  PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE: ${PLANE_AGENT_RUNTIME_SAFETY_STOP_FILE:-/run/plane-agent-runtime/safety-stop}
  PLANE_AGENT_RUNTIME_NETWORK_POLICY: none
  PLANE_AGENT_RUNTIME_BIND: 0.0.0.0
  PLANE_AGENT_RUNTIME_PORT: 8080

services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
      - agent_runtime_internal
    volumes:
      - ./apps/api:/code
      - agent_runtime_credential_state:/run/plane-agent-credentials
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *local-agent-runtime-app-env
    secrets:
      - plane_agent_runtime
    expose:
      - "8091"
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
      - agent_runtime_internal
    volumes:
      - ./apps/api:/code
      - agent_runtime_credential_state:/run/plane-agent-credentials
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *local-agent-runtime-app-env
      PLANE_AGENT_RUNTIME_HOST_URL: ${PLANE_AGENT_RUNTIME_WORKER_HOST_URL:-http://worker:8091}
    secrets:
      - plane_agent_runtime
    expose:
      - "8091"
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *local-agent-runtime-app-env
    secrets:
      - plane_agent_runtime
    depends_on:
      - api
      - plane-db
      - plane-redis

  agent-runtime:
    profiles:
      - agent
    image: ${PLANE_AGENT_RUNTIME_IMAGE:-uxheavy/plane-agent-runtime:hermes-e573a466-g4-ff8cd9c5}
    entrypoint: ["python3", "-m", "plane.agent.runtime.service"]
    command: []
    user: "${PLANE_AGENT_RUNTIME_UID:-65532}:${PLANE_AGENT_RUNTIME_GID:-65532}"
    restart: unless-stopped
    read_only: true
    networks:
      - agent_runtime_internal
    init: true
    expose:
      - "8080"
    environment:
      <<: *local-agent-runtime-service-env
    secrets:
      - plane_agent_runtime
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/plane-agent-runtime:rw,noexec,nosuid,nodev,size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${PLANE_AGENT_RUNTIME_CPUS:-1.0}
    mem_limit: ${PLANE_AGENT_RUNTIME_MEMORY_LIMIT:-768m}
    pids_limit: ${PLANE_AGENT_RUNTIME_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health/ready\", timeout=2)' "]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
      PLANE_DB_MIGRATION_MODE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@${POSTGRES_HOST:-plane-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@${POSTGRES_HOST:-plane-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      DATABASE_RUNTIME_URL: ""
      DATABASE_PROVISIONER_URL: ""
      PLANE_AUDIT_MIGRATION_PASSWORD: ""
    depends_on:
      - plane-db
      - plane-redis

  proxy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - .env
    environment:
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ":80"
    volumes:
      - ./apps/proxy/Caddyfile.ce:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - plane-minio
    ports:
      - "8080:80"

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:
  agent_runtime_credential_state:

networks:
  dev_env:
    driver: bridge
  agent_runtime_internal:
    internal: true

secrets:
  plane_agent_runtime:
    file: .plane-agent-runtime.secret
